<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Finch MSO</title>
<meta name="description" content="Finch MSO — a management services organization for law firms." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="favicon.ico?v=3" sizes="32x32">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002147;
    --light:#b8c4d4;
    --accent:#9bb3d4;
    --slate:#7a8ba3;
    --muted:#6b7d96;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;background:var(--navy);color:#fff;
    font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;left:-220px;bottom:-220px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,0.05) 0%,transparent 70%);pointer-events:none;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- wordmark ---------- */
  .mark{
    padding:44px 48px 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;
    font-size:30px;letter-spacing:0.01em;color:#fff;position:relative;
  }

  /* ---------- statement ---------- */
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 32px;position:relative;
  }
  h1{
    font-family:Georgia,'Times New Roman',serif;font-weight:400;
    font-size:clamp(32px,4.8vw,62px);line-height:1.2;letter-spacing:-0.005em;max-width:960px;
  }
  h1 .line{display:block}
  h1 em{font-style:italic;color:var(--accent)}

  /* ---------- contact ---------- */
  .contact{margin-top:56px;display:flex;flex-direction:column;align-items:center}
  .contact .rule{width:56px;height:1px;background:rgba(255,255,255,0.25);margin-bottom:28px}
  .contact .eyebrow{
    font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--slate);
    font-weight:600;margin-bottom:14px;
  }
  .contact .email{
    font-size:19px;color:#fff;border-bottom:1px solid rgba(255,255,255,0.25);
    padding-bottom:3px;transition:border-color .2s,color .2s;
  }
  .contact .email:hover{border-color:#fff}
  /* ---------- footer ---------- */
  footer{
    padding:0 48px 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
    font-size:12px;color:var(--muted);position:relative;
  }
  footer .copy{text-align:left}
  footer .legal{text-align:center}
  footer .parent{text-align:right}
  footer a:hover{color:#fff}
  footer .parent a{color:var(--light);border-bottom:1px solid rgba(184,196,212,0.35);padding-bottom:1px}
  footer .parent a:hover{color:#fff;border-color:#fff}

  /* ---------- reveal sequence ---------- */
  .reveal{opacity:0;transform:translateY(14px);animation:rise .9s ease forwards}
  .line-1{animation-delay:.2s}
  .line-2{animation-delay:1.3s}
  .contact.reveal{animation-delay:2.5s}
  .mark.reveal,footer.reveal{transform:none;animation-delay:3s}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;transform:none}
  }
  @media (max-width:600px){
    .mark{padding:28px 24px 0;font-size:26px}
    footer{padding:0 24px 24px;grid-template-columns:1fr;justify-items:center}
    footer .copy,footer .legal,footer .parent{text-align:center}
    footer .legal{order:-1}
    .contact{margin-top:44px}
    .contact .email{font-size:17px}
  }
</style>

</head>
<body>

<div class="mark reveal" aria-label="Finch MSO">Finch MSO</div>

<main>
  <h1>
    <span class="line line-1 reveal">Lawyers should practice law.</span>
    <span class="line line-2 reveal"><em>Leave the rest to Finch.</em></span>
  </h1>

  <div class="contact reveal">
    <div class="rule"></div>
    <div class="eyebrow">Inquiries</div>
    <a class="email" href="mailto:partner@finchmso.com">partner@finchmso.com</a>
  </div>
</main>

<footer class="reveal">
  <div class="copy">© 2026 Finch MSO (dba of Krieg Holdings I, LLC). All rights reserved.</div>
  <div class="legal"><a href="legal.html">Legal</a> · <a href="privacy.html">Privacy</a> · <a href="disclosures.html">Disclosures</a></div>
  <div class="parent">A portfolio company of <a href="https://www.kriegmanagement.com" target="_blank" rel="noopener">Krieg Management</a></div>
</footer>

</body>
</html>
